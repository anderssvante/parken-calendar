name: Update Parken Calendar

on:
  schedule:
    - cron: '0 5 * * *'  # daily at 05:00 UTC (~07:00 Copenhagen time)
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pytz

      - name: Run scraper
        run: python scrape_parken.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/parken-kalender.ics
          git diff --staged --quiet || git commit -m "Update calendar $(date -u +%Y-%m-%d)"
          git push
